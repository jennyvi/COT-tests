<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cohort Status Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f9f9fb;
      padding: 40px;
      color: #1a1a1a;
    }

    .card {
      max-width: 500px;
      background: #ffffff;
      border: 2px solid #1a1a1a;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 4px 4px 0px #1a1a1a;
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
    }

    p {
      line-height: 1.5;
      color: #4a4a4a;
    }

    ul {
      list-style-type: disc;
      padding-left: 20px;
      margin: 20px 0;
    }

    li {
      margin-bottom: 8px;
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 24px;
      background-color: #ffffff;
      color: #1a1a1a;
      border: 2px solid #1a1a1a;
      border-radius: 24px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 2px 2px 0px #1a1a1a;
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 4px 4px 0px #1a1a1a;
    }
  </style>
</head>
<body>

  <h1>Cherry Launchpad</h1>

  <!-- CARD POPULATED DYNAMICALLY BY AIRTABLE -->
  <div class="card">
    <h2 id="status-title">Loading status...</h2>
    <p id="status-subtext">Fetching the latest cohort information...</p>
    
    <ul id="status-bullets">
      <!-- Bullets populate here -->
    </ul>

    <a href="#" id="status-button" class="btn" target="_blank">Loading...</a>
  </div>

  <script>
    // --- YOUR PRE-FILLED AIRTABLE CONFIGURATION ---
    const AIRTABLE_ACCESS_TOKEN = 'patpXFd996hxXbdlM.3e61d168b1cd148466f54141f653b2de7cf8643789de4bdc959a0ef6797a860b'; 
    const BASE_ID = 'app1SYNT1kYtx4c30';               
    const TABLE_NAME = 'tblCsSh4mrZvx1jtS';           

    async function fetchCohortStatus() {
      // Build the Airtable API URL using Base ID and Table ID
      const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}`;

      try {
        const response = await fetch(url, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_ACCESS_TOKEN}`
          }
        });

        const data = await response.json();
        
        // Grab fields from the first record in the table
        const fields = data.records[0].fields;

        // Select the HTML DOM elements
        const titleEl = document.getElementById('status-title');
        const subtextEl = document.getElementById('status-subtext');
        const bulletsEl = document.getElementById('status-bullets');
        const buttonEl = document.getElementById('status-button');

        // --- TOGGLE LOGIC ---
        if (fields.Status === 'Open') {
          
          // OPEN STATE
          titleEl.textContent = `${fields['Cohort Name'] || 'Fall 2027'} Cohort Applications Open`;
          subtextEl.textContent = 'Take the first step towards an exciting career in tech. Applications are live for a limited time!';
          
          bulletsEl.innerHTML = `
            <li><strong>Application Window:</strong> ${fields['Formatted App Window'] || 'Dates TBD'}</li>
            <li><strong>Cohort Dates:</strong> ${fields['Formatted Cohort Dates'] || 'Dates TBD'}</li>
          `;

          buttonEl.textContent = 'Join Cherry Launchpad →';
          buttonEl.href = fields['Application Form Link'] || '#';

        } else {
          
          // CLOSED STATE (DEFAULT)
          titleEl.textContent = 'Applications Currently Closed';
          subtextEl.textContent = 'Our cohorts typically run once a year in the Fall. Sign up for the Cherry On Tech newsletter to get notified as soon as new cohort dates and application windows are announced!';
          
          bulletsEl.innerHTML = `
            <li><strong>Typical Schedule:</strong> Fall Cohort (August – December)</li>
            <li><strong>Next Window:</strong> Announced via our newsletter</li>
          `;

          buttonEl.textContent = 'Subscribe for Updates →';
          buttonEl.href = 'https://www.linkedin.com/newsletters/cherryontech-newsletter-7164685602104225792';
        }

      } catch (error) {
        console.error('Error fetching data from Airtable:', error);
        document.getElementById('status-title').textContent = 'Error loading status';
        document.getElementById('status-subtext').textContent = 'Please check your console or Airtable table column names.';
      }
    }

    // Run when page loads
    fetchCohortStatus();
  </script>
</body>
</html>
