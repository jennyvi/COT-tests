<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Volunteer Directory Preview - Cherry On Tech</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background-color: #ffffff;
                margin: 0;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            /* Clean container specifically for Airtable */
            .airtable-container {
                width: 100%;
                max-width: 1000px;
                background: #ffffff;
                padding: 24px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                margin-top: 10px;
                margin-bottom: 40px;
            }
            /* Static Image Styling (replaces the Figma iframe) */
            .preview-image {
                width: 100%;
                max-width: 1200px;
                height: auto;
                display: block;
                border-radius: 8px;
            }
            /* Airtable Frame */
            .airtable-embed {
                width: 100% !important;
                border: none !important;
                background: transparent;
            }
        </style>
    </head>
    <body>

        <!-- Static Image Section (Replace file name if using .jpg) -->
        <img src="COT About.png" alt="COT About Preview" class="preview-image" />

        <!-- Airtable Live Embed Section -->
        <div class="airtable-container">
            <iframe class="airtable-embed" height="800" src="https://airtable.com/embed/appQGB7QVsOOx0rX1/shrdr5rUPSbRwHacA" frameborder="0" onmousewheel=""></iframe>
        </div>

        <!-- Static Image Section (Replace file name if using .jpg) -->
        <img src="Desktop Footer.png" alt="Desktop Footer" class="preview-image" />
        
    </body>
</html>
